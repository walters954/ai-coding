name: Generic resource checks
on:
  pull_request:
    paths:
      - 'tools/github-status/**'
      - 'skills/diff-explainer/**'
      - '.github/workflows/resource-checks.yml'
  push:
    branches: [main]
    paths:
      - 'tools/github-status/**'
      - 'skills/diff-explainer/**'
      - '.github/workflows/resource-checks.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tools/github-status/tests -v
      - run: python tools/github-status/tests/example_output.py
